name: Windows library checks at the PR head
on:
  push:
    branches: ['codex/55688-native-lab']
    paths: ['.github/workflows/55688-lib.yml']
permissions:
  contents: read
jobs:
  library:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: f8970156302408a618c2a9b3f3443f92f8cbf20f
          persist-credentials: false
      - name: Observe the regression on the original parser
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          if cargo test --locked --lib ctrl_letters_use_the_control_code_or_the_virtual_key_when_nul > red.log; then exit 1; fi
          cat red.log
          grep '1 failed' red.log
      - name: Check the patched parser with the default, Codex and minimal features
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin a6010533ecaf8e135902c1a5c7f44f08e00fd796
          git checkout --detach a6010533ecaf8e135902c1a5c7f44f08e00fd796
          git rev-parse HEAD
          cargo test --locked --lib
          cargo test --locked --lib --features event-stream
          cargo test --locked --lib --no-default-features --features windows,events
